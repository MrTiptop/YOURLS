# https://docs.github.com/actions

name: Auto-merge

on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    name: Dependabot
    # The reusable workflow expects branch protection compatible with auto-merge.
    # Skip on forks/clones where this policy may not exist.
    if: ${{ github.repository == 'YOURLS/YOURLS' }}
    uses: YOURLS/.github/.github/workflows/auto-merge.yml@main
